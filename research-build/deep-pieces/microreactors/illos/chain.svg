<svg viewBox="0 0 940 420" role="img" aria-label="The fuel chain from mine to microreactor in seven steps. One, mine: ore is about 0.7 per cent U-235, bought worldwide. Two, convert: uranium into UF6 gas, done at industrial scale. Three, enrich: centrifuges raise U-235 to 5 per cent for ordinary fuel or 19.75 per cent for HALEU; America has one HALEU line, 16 centrifuges run by Centrus in Ohio. Until 2024 Russia was the only commercial seller of HALEU, and imports are now banned. Four, deconvert: the gas is turned back into a solid; GAO says this does not yet exist for HALEU. Government stock of about 21 tonnes by 2028 enters here. Five, make TRISO: about 0.7 tonnes of uranium a year from BWXT and Standard Nuclear. Six, ship: one package is approved for HALEU gas and has not been manufactured; stricter security applies above 10 per cent. Seven, reactor: loaded once, runs three to eight years, 1 to 20 megawatts of electricity. Enrichment, deconversion and TRISO are marked as choke points."><defs><marker id="ch" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--ink-3)"/></marker></defs><rect class="i-ground" x="0" y="250" width="940" height="18"/><line class="i-line" x1="0" y1="250" x2="940" y2="250"/><rect class="i-choke" x="276" y="84" width="392" height="316" rx="6"/><text class="i-hot-t" x="284" y="100" style="font-size:10.5px;letter-spacing:.08em">THE CHOKE POINTS</text><line class="i-lead" x1="134" y1="210" x2="148" y2="210" marker-end="url(#ch)"/><line class="i-lead" x1="266" y1="210" x2="280" y2="210" marker-end="url(#ch)"/><line class="i-lead" x1="398" y1="210" x2="412" y2="210" marker-end="url(#ch)"/><line class="i-lead" x1="530" y1="210" x2="544" y2="210" marker-end="url(#ch)"/><line class="i-lead" x1="662" y1="210" x2="676" y2="210" marker-end="url(#ch)"/><line class="i-lead" x1="794" y1="210" x2="808" y2="210" marker-end="url(#ch)"/><path class="i-fill" d="M20 250 L38 236 H116 L132 250 Z"/><path class="i-thin" d="M44 244 H110 M54 239 H102"/><path class="i-line" d="M50 210 h28 v-14 h-12 l-6 -8 h-10 z"/><circle class="i-fill" cx="56" cy="212" r="4"/><circle class="i-fill" cx="72" cy="212" r="4"/><circle class="i-fuel" cx="96" cy="224" r="4" opacity=".5"/><circle class="i-fuel" cx="104" cy="220" r="3" opacity=".5"/><rect class="i-fill" x="164" y="160" width="18" height="90"/><rect class="i-fill" x="194" y="180" width="14" height="70"/><rect class="i-fill" x="224" y="195" width="22" height="55"/><path class="i-thin" d="M172 160 v-10 M198 180 q 6 -8 0 -16 q -6 -8 0 -16" opacity=".6"/><rect class="i-fill" x="160" y="224" width="96" height="26"/><rect class="i-metal" x="286" y="130" width="108" height="120" rx="2"/><rect class="i-fill" x="296.0" y="138" width="7" height="46" rx="3.5"/><rect class="i-fill" x="308.5" y="138" width="7" height="46" rx="3.5"/><rect class="i-fill" x="321.0" y="138" width="7" height="46" rx="3.5"/><rect class="i-fill" x="333.5" y="138" width="7" height="46" rx="3.5"/><rect class="i-fill" x="346.0" y="138" width="7" height="46" rx="3.5"/><rect class="i-fill" x="358.5" y="138" width="7" height="46" rx="3.5"/><rect class="i-fill" x="371.0" y="138" width="7" height="46" rx="3.5"/><rect class="i-fill" x="383.5" y="138" width="7" height="46" rx="3.5"/><rect class="i-fill" x="296.0" y="194" width="7" height="46" rx="3.5"/><rect class="i-fill" x="308.5" y="194" width="7" height="46" rx="3.5"/><rect class="i-fill" x="321.0" y="194" width="7" height="46" rx="3.5"/><rect class="i-fill" x="333.5" y="194" width="7" height="46" rx="3.5"/><rect class="i-fill" x="346.0" y="194" width="7" height="46" rx="3.5"/><rect class="i-fill" x="358.5" y="194" width="7" height="46" rx="3.5"/><rect class="i-fill" x="371.0" y="194" width="7" height="46" rx="3.5"/><rect class="i-fill" x="383.5" y="194" width="7" height="46" rx="3.5"/><rect class="i-fill" x="430" y="170" width="50" height="80" rx="3"/><path class="i-hot" d="M444 220 q 4 -10 0 -18 M458 220 q 4 -10 0 -18"/><path class="i-fill" d="M490 250 l14 -24 h12 l14 24 z"/><circle class="i-fuel" cx="510" cy="242" r="6" opacity=".7"/><path class="i-fill" d="M588 250 V140 q 16 -18 32 0 V250 Z"/><circle class="i-fuel" cx="594" cy="220" r="2.4"/><circle class="i-fuel" cx="601" cy="207" r="2.4"/><circle class="i-fuel" cx="608" cy="194" r="2.4"/><circle class="i-fuel" cx="595" cy="181" r="2.4"/><circle class="i-fuel" cx="602" cy="168" r="2.4"/><circle class="i-fuel" cx="609" cy="155" r="2.4"/><circle class="i-fuel" cx="596" cy="212" r="2.4"/><circle class="i-fuel" cx="603" cy="199" r="2.4"/><circle class="i-fuel" cx="610" cy="186" r="2.4"/><circle class="i-fuel" cx="597" cy="173" r="2.4"/><circle class="i-fuel" cx="604" cy="160" r="2.4"/><circle class="i-fuel" cx="611" cy="217" r="2.4"/><circle class="i-fuel" cx="598" cy="204" r="2.4"/><circle class="i-fuel" cx="605" cy="191" r="2.4"/><path class="i-cool" d="M578 242 H588"/><path class="i-thin" d="M604 122 v-12"/><rect class="i-fill" x="686" y="216" width="100" height="12" rx="2"/><rect class="i-metal" x="698" y="180" width="64" height="36" rx="14"/><path class="i-line" d="M686 216 v-22 h-0"/><circle class="i-fill" cx="700" cy="236" r="8"/><circle class="i-fill" cx="720" cy="236" r="8"/><circle class="i-fill" cx="766" cy="236" r="8"/><rect class="i-metal" x="832" y="154" width="70" height="96" rx="3"/><rect class="i-fuel-soft" x="850" y="180" width="34" height="42" rx="3"/><text class="i-k" x="20" y="270">Step 1</text><text class="i-t" x="20" y="286">Mine</text><text class="i-n" x="20" y="302">Ore is about</text><text class="i-n" x="20" y="316">0.7% U-235, the</text><text class="i-n" x="20" y="330">atom that splits</text><text class="i-n2" x="20" y="354" style="font-size:11.5px">Bought worldwide</text><text class="i-k" x="152" y="270">Step 2</text><text class="i-t" x="152" y="286">Convert</text><text class="i-n" x="152" y="302">Uranium into UF6,</text><text class="i-n" x="152" y="316">a gas a centrifuge</text><text class="i-n" x="152" y="330">can spin</text><text class="i-n2" x="152" y="354" style="font-size:11.5px">Done at scale</text><text class="i-k" x="284" y="270">Step 3</text><text class="i-t" x="284" y="286">Enrich</text><text class="i-n" x="284" y="302">Spin the gas to 5%</text><text class="i-n" x="284" y="316">for ordinary fuel,</text><text class="i-n" x="284" y="330">19.75% for HALEU</text><text class="i-hot-t" x="284" y="354" style="font-size:11.5px">One HALEU line:</text><text class="i-hot-t" x="284" y="368" style="font-size:11.5px">16 centrifuges,</text><text class="i-hot-t" x="284" y="382" style="font-size:11.5px">Centrus, Ohio</text><text class="i-k" x="416" y="270">Step 4</text><text class="i-t" x="416" y="286">Deconvert</text><text class="i-n" x="416" y="302">Gas back into a</text><text class="i-n" x="416" y="316">solid: oxide or</text><text class="i-n" x="416" y="330">metal</text><text class="i-hot-t" x="416" y="354" style="font-size:11.5px">"Does not yet</text><text class="i-hot-t" x="416" y="368" style="font-size:11.5px">exist for HALEU"</text><text class="i-hot-t" x="416" y="382" style="font-size:11.5px">(GAO, 2026)</text><text class="i-k" x="548" y="270">Step 5</text><text class="i-t" x="548" y="286">Make TRISO</text><text class="i-n" x="548" y="302">Kernels coated in</text><text class="i-n" x="548" y="316">four layers, then</text><text class="i-n" x="548" y="330">set in graphite</text><text class="i-hot-t" x="548" y="354" style="font-size:11.5px">About 0.7 t a year:</text><text class="i-hot-t" x="548" y="368" style="font-size:11.5px">BWXT, Standard</text><text class="i-hot-t" x="548" y="382" style="font-size:11.5px">Nuclear</text><text class="i-k" x="680" y="270">Step 6</text><text class="i-t" x="680" y="286">Ship</text><text class="i-n" x="680" y="302">One package for</text><text class="i-n" x="680" y="316">HALEU gas, not</text><text class="i-n" x="680" y="330">yet built</text><text class="i-n2" x="680" y="354" style="font-size:11.5px">Stricter security</text><text class="i-n2" x="680" y="368" style="font-size:11.5px">above 10% U-235</text><text class="i-k" x="812" y="270">Step 7</text><text class="i-t" x="812" y="286">Reactor</text><text class="i-n" x="812" y="302">Loaded once,</text><text class="i-n" x="812" y="316">runs three to</text><text class="i-n" x="812" y="330">eight years</text><text class="i-n2" x="812" y="354" style="font-size:11.5px">1 to 20 MWe</text><text class="i-n" x="152" y="44">Until 2024 the only commercial seller</text><text class="i-n" x="152" y="58">of HALEU was Russia. Imports banned.</text><path class="i-lead" d="M340 62 V126"/><path class="i-dash" d="M472 64 V162" style="stroke:var(--fuel)" marker-end="url(#ch)"/><text class="i-fuel-t" x="472" y="44" text-anchor="middle">Government stock</text><text class="i-n" x="472" y="58" text-anchor="middle">about 21 t by 2028</text></svg>