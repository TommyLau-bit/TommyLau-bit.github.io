ine class="i-lead" x1="355.2" y1="213.8" x2="368" y2="156"/><text class="i-t" x="372" y="230">Fuel blocks hold the TRISO</text><text class="i-n" x="372" y="245">holes for fuel, channels for helium</text><line class="i-lead" x1="266" y1="240" x2="368" y2="236"/><text class="i-t" x="372" y="292">Shutdown rod in the centre</text><text class="i-n" x="372" y="307">a backup that drops in if needed</text><line class="i-lead" x1="207" y1="252" x2="368" y2="298"/><text class="i-k" x="640" y="28">2 · The plant on a trailer</text><text class="i-n" x="640" y="44">shipping-container sized modules</text><rect class="i-fill" x="618" y="330" width="300" height="14" rx="2"/><circle class="i-fill" cx="650" cy="354" r="11"/><circle cx="650" cy="354" r="3" style="fill:var(--ink-3)"/><circle class="i-fill" cx="678" cy="354" r="11"/><circle cx="678" cy="354" r="3" style="fill:var(--ink-3)"/><circle class="i-fill" cx="860" cy="354" r="11"/><circle cx="860" cy="354" r="3" style="fill:var(--ink-3)"/><circle class="i-fill" cx="888" cy="354" r="11"/><circle cx="888" cy="354" r="3" style="fill:var(--ink-3)"/><line class="i-faint" x1="600" y1="365" x2="930" y2="365"/><rect class="i-metal" x="628" y="160" width="120" height="170" rx="4"/><rect class="i-fill" x="650" y="190" width="76" height="118" rx="30"/><rect class="i-fuel-soft" x="664" y="218" width="48" height="62" rx="3"/><text class="i-n2" x="688" y="386" text-anchor="middle">Reactor</text><text class="i-n" x="688" y="400" text-anchor="middle">core and shield</text><rect class="i-fill" x="768" y="200" width="140" height="130" rx="4"/><path class="i-line" d="M790 240 L820 230 V280 L790 270 Z"/><circle class="i-fill" cx="866" cy="255" r="22"/><text class="i-n2" x="866" y="259" text-anchor="middle">G</text><line class="i-line" x1="820" y1="255" x2="844" y2="255"/><text class="i-n2" x="838" y="386" text-anchor="middle">Turbine and generator</text><text class="i-n" x="838" y="400" text-anchor="middle">heat into electricity</text><path class="i-hot" d="M712 218 V180 H780 V232 H790" marker-end="url(#ahot)"/><path class="i-cool" d="M790 268 H770 V320 H700 V280" marker-end="url(#acool)"/><text class="i-hot-t" x="752" y="174">hot helium</text><text class="i-cool-t" x="704" y="328" style="font-size:11px"></text><line class="i-hot" x1="908" y1="255" x2="926" y2="255"/><text class="i-hot-t" x="900" y="300" text-anchor="end">electricity out</text><text class="i-n" x="900" y="314" text-anchor="end">1 to 20 MWe</text><text class="i-n" x="640" y="430">Built and fuelled in a factory, trucked in,</text><text class="i-n" x="640" y="444">run for years, then trucked back out.</text></svg>