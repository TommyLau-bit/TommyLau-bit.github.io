<svg viewBox="0 0 930 470" role="img" aria-label="Inside a transportable gas-cooled microreactor. Left: the core seen from above. Hexagonal graphite fuel blocks hold TRISO fuel and helium channels, with a shutdown rod in the centre. A ring of reflector surrounds them, bouncing escaping neutrons back. Twelve control drums sit in the reflector, each with an absorbing face: turned out, the reactor runs; turned in, they soak up neutrons and stop it. Right: the plant as modules on a trailer. Hot helium carries heat from the reactor module to a turbine and generator, and returns cooled. Output 1 to 20 megawatts of electricity."><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--ink-2)"/></marker><marker id="ahot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--hot)"/></marker><marker id="acool" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--cool)"/></marker></defs><text class="i-k" x="20" y="28">1 · The core, seen from above</text><text class="i-n" x="20" y="44">simplified, not to scale</text><circle class="i-metal" cx="200" cy="250" r="170"/><circle class="i-fill" cx="200" cy="250" r="108" style="fill:var(--bg)"/><polygon class="i-fuel-soft" points="153.2,211.1 142.9,228.9 122.4,228.9 112.2,211.1 122.4,193.4 142.9,193.4"/><circle class="i-fuel" cx="141.3" cy="216.1" r="2.3"/><circle class="i-fuel" cx="132.7" cy="221.1" r="2.3"/><circle class="i-fuel" cx="124.0" cy="216.1" r="2.3"/><circle class="i-fuel" cx="124.0" cy="206.1" r="2.3"/><circle class="i-fuel" cx="132.7" cy="201.1" r="2.3"/><circle class="i-fuel" cx="141.3" cy="206.1" r="2.3"/><circle cx="132.7" cy="211.1" r="3" style="fill:var(--bg);stroke:var(--cool);stroke-width:1.2"/><polygon class="i-fuel-soft" points="153.2,250.0 142.9,267.8 122.4,267.8 112.2,250.