<svg viewBox="0 0 940 470" role="img" aria-label="A simplified nuclear plant: the core heats water, which boils water in a steam generator; steam drives a turbine, which turns a generator; a transformer steps the power up for the grid; condensed water returns to the steam generator. A measurement uncertainty recapture uprate, under 2 per cent, fits better meters on the returning water. A stretch uprate, up to 7 per cent, moves instrument settings within the design margins. An extended uprate, up to 20 per cent, replaces the turbine, generator, pumps or transformer, during refuelling shutdowns, and needs the same heavy equipment the rest of the grid queues for."><rect class="i-ground" x="0" y="300" width="940" height="12"/><line class="i-line" x1="0" y1="300" x2="940" y2="300"/><path class="i-metal" d="M40 300 V150 A90 90 0 0 1 220 150 V300 Z" style="opacity:.55"/><rect class="i-fill" x="66" y="190" width="54" height="100" rx="20"/><rect class="i-fuel-soft" x="78" y="214" width="30" height="56" rx="3"/><text class="i-n" x="93" y="182" text-anchor="middle">core</text><rect class="i-fill" x="146" y="140" width="46" height="140" rx="20"/><text class="i-n" x="169" y="118" text-anchor="middle">steam</text><text class="i-n" x="169" y="132" text-anchor="middle">generator</text><path class="i-hot" d="M120 220 H146 M120 250 H146" style="stroke-width:2.4"/><path class="i-hot" d="M192 160 H250 V170 H300" style="stroke-width:3"/><path class="i-metal" d="M300 150 L450 130 V230 L300 210 Z"/><line class="i-thin" x1="318" y1="152" x2="318" y2="208"/><line class="i-thin" x1="340" y1="149" x2="340" y2="211"/><line class="i-thin" x1="362" y1="146" x2="362" y2="214"/><line class="i-thin" x1="384" y1="143" x2="384" y2="217"/><line class="i-thin" x1="406" y1="140" x2="406" y2="220"/><line class="i-thin" x1="428" y1="137" x2="428" y2="223"/><text class="i-t" x="362" y="254" text-anchor="middle">Turbine</text><line class="i-line" x1="450" y1="180" x2="490" y2="180" style="stroke-width:4"/><rect class="i-metal" x="490" y="140" width="90" height="80" rx="12"/><circle class="i-line" cx="535" cy="180" r="22" style="fill:none"/><text class="i-t" x="535" y="262" text-anchor="middle">Generator</text><line class="i-line" x1="580" y1="160" x2="630" y2="160"/><rect class="i-metal" x="630" y="190" width="70" height="110" rx="3"/><line class="i-thin" x1="640" y1="196" x2="640" y2="294"/><line class="i-thin" x1="656" y1="196" x2="656" y2="294"/><line class="i-thin" x1="672" y1="196" x2="672" y2="294"/><line class="i-thin" x1="688" y1="196" x2="688" y2="294"/><path class="i-line" d="M665 190 V160"/><text class="i-t" x="665" y="334" text-anchor="middle">Transformer</text><path class="i-line" d="M736 300 L760 120 L784 300 M742 240 H778 M748 200 H772 M730 140 H790"/><path class="i-thin" d="M700 200 Q 710 170 730 140"/><text class="i-t" x="760" y="334" text-anchor="middle">To the grid</text><path class="i-cool" d="M438 228 V280 H230 V250 H192" style="stroke-width:2.6"/><text class="i-n" x="262" y="294">condensed water returns</text><circle class="i-cool-f" cx="248" cy="280" r="11"/><path d="M242 280 L253 275" style="stroke:var(--bg);stroke-width:2"/><rect class="i-fuel" x="236" y="60" width="64" height="40" rx="4" style="opacity:.9"/><circle cx="252" cy="80" r="4" style="fill:var(--bg)"/><circle cx="268" cy="80" r="4" style="fill:var(--bg)"/><circle cx="284" cy="80" r="4" style="fill:var(--bg)"/><path class="i-lead" d="M236 80 Q 200 80 170 120"/><rect class="i-choke" x="288" y="112" width="424" height="196" rx="8"/><text class="i-cool-t" x="40" y="360">● Under 2%: measurement uncertainty recapture</text><text class="i-n" x="40" y="376">Better meters on the returning water, so the plant knows</text><text class="i-n" x="40" y="391">its true power and runs closer to its limit</text><text class="i-fuel-t" x="40" y="420">■ Up to 7%: stretch</text><text class="i-n" x="40" y="436">Instrument settings moved within the</text><text class="i-n" x="40" y="451">margins the plant was designed with</text><text class="i-hot-t" x="500" y="360">▢ Up to 20%: extended</text><text class="i-n" x="500" y="376">New turbines, generators, pumps or transformers,</text><text class="i-n" x="500" y="391">fitted while the reactor is shut to refuel. The same</text><text class="i-n" x="500" y="406">heavy equipment the rest of the grid is queueing for</text><path class="i-lead" d="M248 291 V340"/><text class="i-n" x="236" y="50">controls</text></svg>