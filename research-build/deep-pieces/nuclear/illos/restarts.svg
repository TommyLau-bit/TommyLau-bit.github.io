<svg viewBox="0 0 560 222" role="img" aria-label="Milestones of the three restarts. Crane closed in September 2019, filed with the NRC from November 2024, has an NRC target of 4 March 2027 and expects power in the second half of 2027. Palisades closed in May 2022, filed from February 2023, won NRC approval in July 2025, and has no date since its fuel loading stopped; its contracts and grid place run to 1 March 2027. Duane Arnold closed in August 2020, filed from January 2025, expects power by the first quarter of 2029, and must run by 31 December 2029 to keep its grid place."><g class="c-grid"><line x1="120.0" y1="26" x2="120.0" y2="196"/><line x1="170.0" y1="26" x2="170.0" y2="196"/><line x1="220.0" y1="26" x2="220.0" y2="196"/><line x1="270.0" y1="26" x2="270.0" y2="196"/><line x1="320.0" y1="26" x2="320.0" y2="196"/><line x1="370.0" y1="26" x2="370.0" y2="196"/><line x1="420.0" y1="26" x2="420.0" y2="196"/></g><g class="c-axis"><text x="120.0" y="214" text-anchor="middle">2019</text><text x="170.0" y="214" text-anchor="middle">2021</text><text x="220.0" y="214" text-anchor="middle">2023</text><text x="270.0" y="214" text-anchor="middle">2025</text><text x="320.0" y="214" text-anchor="middle">2027</text><text x="370.0" y="214" text-anchor="middle">2029</text><text x="420.0" y="214" text-anchor="middle">2031</text></g><text class="c-box-t" x="0" y="56">Crane</text><line class="c-line c-mute" x1="137.9" y1="52" x2="265.8" y2="52" style="stroke-dasharray:2 4"/><circle class="c-dot" cx="137.9" cy="52" r="4" style="fill:var(--ink-3)"/><text class="c-note" x="137.9" y="42" text-anchor="middle">closed</text><g class="c-span"><line x1="265.8" y1="52" x2="324.2" y2="52"/></g><g class="c-start"><circle cx="265.8" cy="52" r="4"/></g><text class="c-note" x="265.8" y="72" text-anchor="middle">NRC filing</text><text class="c-note" x="324.2" y="42" text-anchor="middle">NRC target</text><line class="c-span" x1="324.2" y1="52" x2="338.8" y2="52" style="stroke-dasharray:4 4"/><g class="c-end"><circle cx="338.8" cy="52" r="4.5"/></g><g class="c-endt"><text x="348.8" y="56">power, second half 2027</text></g><text class="c-box-t" x="0" y="116">Palisades</text><line class="c-line c-mute" x1="204.6" y1="112" x2="222.1" y2="112" style="stroke-dasharray:2 4"/><circle class="c-dot" cx="204.6" cy="112" r="4" style="fill:var(--ink-3)"/><text class="c-note" x="204.6" y="102" text-anchor="middle">closed</text><g class="c-span"><line x1="222.1" y1="112" x2="284.2" y2="112"/></g><g class="c-start"><circle cx="222.1" cy="112" r="4"/></g><text class="c-note" x="222.1" y="132" text-anchor="middle">NRC filing</text><text class="c-note" x="284.2" y="102" text-anchor="middle">NRC approval</text><g class="c-endt"><text x="334.2" y="116">no date</text></g><line class="c-today" x1="324.2" y1="96" x2="324.2" y2="128"/><text class="c-today-t" x="324.2" y="142" text-anchor="middle">contract deadline, March 2027</text><text class="c-box-t" x="0" y="176">Duane Arnold</text><line class="c-line c-mute" x1="160.2" y1="172" x2="271.7" y2="172" style="stroke-dasharray:2 4"/><circle class="c-dot" cx="160.2" cy="172" r="4" style="fill:var(--ink-3)"/><text class="c-note" x="160.2" y="162" text-anchor="middle">closed</text><g class="c-span"><line x1="271.7" y1="172" x2="375.0" y2="172"/></g><g class="c-start"><circle cx="271.7" cy="172" r="4"/></g><text class="c-note" x="271.7" y="192" text-anchor="middle">NRC filing</text><line class="c-span" x1="375.0" y1="172" x2="375.0" y2="172" style="stroke-dasharray:4 4"/><g class="c-end"><circle cx="375.0" cy="172" r="4.5"/></g><g class="c-endt"><text x="405.0" y="176">by Q1 2029</text></g><line class="c-today" x1="395.0" y1="156" x2="395.0" y2="188"/><text class="c-today-t" x="395.0" y="202" text-anchor="middle">grid deadline, end 2029</text></svg>