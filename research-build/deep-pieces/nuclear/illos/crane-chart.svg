<svg viewBox="0 0 560 176" role="img" aria-label="Timeline for Crane, from its announcement in September 2024. The reactor itself can run in the second half of 2027. Constellation told FERC that full delivery through a fresh grid request could be at risk until the end of 2030, on its reading of PJM's first study. FERC's waiver of 1 June 2026 lets 760 MW of rights move from Eddystone, which could potentially bring full delivery sooner, but PJM's studies decide."><g class="c-grid"><line x1="200.0" y1="30" x2="200.0" y2="150"/><line x1="285.0" y1="30" x2="285.0" y2="150"/><line x1="370.0" y1="30" x2="370.0" y2="150"/><line x1="455.0" y1="30" x2="455.0" y2="150"/><line x1="540.0" y1="30" x2="540.0" y2="150"/></g><g class="c-axis"><text x="200.0" y="168" text-anchor="middle">2024</text><text x="285.0" y="168" text-anchor="middle">2026</text><text x="370.0" y="168" text-anchor="middle">2028</text><text x="455.0" y="168" text-anchor="middle">2030</text><text x="540.0" y="168" text-anchor="middle">2032</text><text x="188" y="58" text-anchor="end">The reactor itself</text><text x="188" y="100" text-anchor="end">Full grid delivery, fresh request</text><text x="188" y="142" text-anchor="end">With Eddystone's 760 MW</text></g><line class="c-today" x1="302.7" y1="30" x2="302.7" y2="150"/><text class="c-today-t" x="302.7" y="24" text-anchor="middle">FERC waiver, 1 June 2026</text><g class="c-span"><line x1="230.5" y1="54" x2="359.4" y2="54"/><line x1="230.5" y1="96" x2="497.5" y2="96"/></g><g class="c-span"><line x1="302.7" y1="138" x2="493.3" y2="138" style="stroke-dasharray:4 4"/></g><g class="c-start"><circle cx="302.7" cy="138" r="4"/></g><g class="c-start"><circle cx="230.5" cy="54" r="4"/><circle cx="230.5" cy="96" r="4"/></g><g class="c-end"><circle cx="359.4" cy="54" r="4.5"/><circle cx="497.5" cy="96" r="4.5"/></g><g class="c-endt"><text x="368.4" y="58">second half 2027</text><text x="489.5" y="84" text-anchor="end">at risk to the end of 2030</text><text x="308.7" y="128">potentially sooner; PJM's studies decide</text></g></svg>