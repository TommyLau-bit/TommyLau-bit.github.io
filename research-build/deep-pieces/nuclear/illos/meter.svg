<svg viewBox="0 0 940 410" role="img" aria-label="Two ways to supply a data centre from a nuclear plant. Behind the meter, or co-located, the campus sits beside the plant and takes power before it reaches the grid, using the grid only for top-up and backup; Talen's Susquehanna plant supplied an Amazon campus this way until April 2026, after FERC rejected a larger co-located load in November 2024, and since December 2025 co-located load in PJM must take a transmission service. In front of the meter, the plant sells all its output into the grid and the campus buys from the grid, with a 20-year power purchase agreement matching the two on paper. Every binding nuclear deal for AI on the PJM and MISO grids now works this way; the exception is Comanche Peak in Texas."><text class="i-t" x="24" y="34">Behind the meter: co-located</text><text class="i-n" x="24" y="52">The campus takes power before it reaches the grid</text><rect class="i-ground" x="10" y="270" width="440.0" height="10"/><line class="i-line" x1="10" y1="270" x2="450.0" y2="270"/><text class="i-t" x="494.0" y="34">In front of the meter: through the grid</text><text class="i-n" x="494.0" y="52">The plant sells into the grid; the campus buys from it</text><rect class="i-ground" x="480.0" y="270" width="440.0" height="10"/><line class="i-line" x1="480.0" y1="270" x2="920.0" y2="270"/><path class="i-metal" d="M30 270 V210 A34 34 0 0 1 98 210 V270 Z"/><path class="i-fill" d="M120 270 C 128 220, 126 190, 122 174 H172 C 168 190, 166 220, 174 270 Z"/><rect class="i-fill" x="230" y="214" width="110" height="56" rx="3"/><rect class="i-cool-f" x="242" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-cool-f" x="261" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-cool-f" x="280" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-cool-f" x="299" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-cool-f" x="318" y="226" width="11" height="34" rx="1" opacity=".75"/><path class="i-hot" d="M176 190 H285 V214" style="stroke-width:2.8"/><path class="i-line" d="M384 270 L400 180 L416 270 M388 240 H412 M392 210 H408 M378 194 H422"/><rect class="i-hot-f" x="389" y="139" width="22" height="22" rx="4"/><text x="400" y="154" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">M</text><path class="i-thin" d="M285 190 H330 V150 H389" style="stroke-dasharray:4 3"/><text class="i-n" x="330" y="140" text-anchor="middle">top-up and backup</text><text class="i-n" x="24" y="306">Example: Talen's Susquehanna plant and an Amazon</text><text class="i-n" x="24" y="322">campus beside it, until April 2026. FERC rejected a larger</text><text class="i-n" x="24" y="338">co-located load in November 2024; since December 2025</text><text class="i-n" x="24" y="354">co-located load in PJM must take a transmission service.</text><path class="i-metal" d="M490.0 270 V210 A34 34 0 0 1 558.0 210 V270 Z"/><path class="i-fill" d="M580.0 270 C 588.0 220, 586.0 190, 582.0 174 H632.0 C 628.0 190, 626.0 220, 634.0 270 Z"/><path class="i-line" d="M684.0 270 L700.0 180 L716.0 270 M688.0 240 H712.0 M692.0 210 H708.0 M678.0 194 H722.0"/><rect class="i-fill" x="800.0" y="214" width="110" height="56" rx="3"/><rect class="i-cool-f" x="812.0" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-cool-f" x="831.0" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-cool-f" x="850.0" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-cool-f" x="869.0" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-cool-f" x="888.0" y="226" width="11" height="34" rx="1" opacity=".75"/><rect class="i-hot-f" x="639.0" y="179" width="22" height="22" rx="4"/><text x="650.0" y="194" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">M</text><rect class="i-hot-f" x="759.0" y="179" width="22" height="22" rx="4"/><text x="770.0" y="194" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">M</text><path class="i-hot" d="M636.0 190 H639.0 M661.0 190 H759.0 M781.0 190 H855.0 V214" style="stroke-width:2.8"/><rect class="i-fill" x="620.0" y="74" width="160" height="44" rx="3"/><text class="i-t" x="700.0" y="94" text-anchor="middle">Power purchase</text><text class="i-n" x="700.0" y="110" text-anchor="middle">agreement, 20 years</text><path class="i-lead" d="M620.0 96 Q 560.0 96 540.0 140"/><path class="i-lead" d="M780.0 96 Q 850.0 96 855.0 150"/><text class="i-n" x="494.0" y="306">Every binding deal in PJM and MISO: Crane,</text><text class="i-n" x="494.0" y="322">Susquehanna since April 2026, Clinton, Duane Arnold,</text><text class="i-n" x="494.0" y="338">Calvert Cliffs, Vistra's plants and Google's uprates.</text><text class="i-n" x="494.0" y="354">The match between plant and campus is on paper.</text><line class="i-faint" x1="470.0" y1="20" x2="470.0" y2="360"/><text class="i-k" x="24" y="398">M = a meter, where power enters or leaves the grid and grid charges apply</text></svg>