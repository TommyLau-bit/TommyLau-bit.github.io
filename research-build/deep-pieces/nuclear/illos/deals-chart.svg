<svg viewBox="0 0 560 342" role="img" aria-label="Megawatts in nuclear deals for AI in America. Binding power purchase agreements on existing reactors and their uprates: 9,880 MW across eight deals. Binding contract on a new reactor: up to 50 MW, Hermes 2. Not contracts to buy power: TerraPower for Meta, two units up to 690 MW funded with rights to six more; Oklo for Meta, a prepayment framework for up to 1,200 MW; Kairos for Google, a 500 MW framework by 2035; X-energy for Amazon, a target of more than 5,000 MW by 2039."><g class="c-grid"><line x1="210.0" y1="18" x2="210.0" y2="326"/><line x1="287.5" y1="18" x2="287.5" y2="326"/><line x1="365.0" y1="18" x2="365.0" y2="326"/><line x1="442.5" y1="18" x2="442.5" y2="326"/><line x1="520.0" y1="18" x2="520.0" y2="326"/></g><g class="c-axis"><text x="210.0" y="12" text-anchor="middle">0</text><text x="287.5" y="12" text-anchor="middle">2,500</text><text x="365.0" y="12" text-anchor="middle">5,000</text><text x="442.5" y="12" text-anchor="middle">7,500</text><text x="520.0" y="12" text-anchor="middle">10,000</text></g><text class="c-lab c-s2t" x="0" y="46">Binding contracts</text><text class="c-box-t" x="0" y="69">Existing reactors</text><text class="c-note" x="0" y="84">8 deals, incl. their uprates</text><rect class="c-bar" x="210" y="60" width="306.3" height="22" rx="2"/><text class="c-lab c-s1t" x="522.3" y="76">9,880 MW</text><text class="c-box-t" x="0" y="111">New reactors</text><text class="c-note" x="0" y="126">Hermes 2, for Google via TVA</text><rect class="c-bar c-alt" x="210" y="102" width="2.0" height="22" rx="2"/><text class="c-lab c-s1t" x="217.6" y="118">up to 50 MW</text><text class="c-lab c-s2t" x="0" y="160">Not contracts to buy power</text><text class="c-box-t" x="0" y="183">TerraPower, for Meta</text><text class="c-note" x="0" y="198">two units funded; rights to six more</text><rect class="c-bar c-mute" x="210" y="174" width="21.4" height="22" rx="2"/><text class="c-lab c-s1t" x="237.4" y="190">up to 690 MW</text><text class="c-box-t" x="0" y="225">Oklo, for Meta</text><text class="c-note" x="0" y="240">prepayment framework</text><rect class="c-bar c-mute" x="210" y="216" width="37.2" height="22" rx="2"/><text class="c-lab c-s1t" x="253.2" y="232">up to 1,200 MW</text><text class="c-box-t" x="0" y="267">Kairos, for Google</text><text class="c-note" x="0" y="282">framework, by 2035</text><rect class="c-bar c-mute" x="210" y="258" width="15.5" height="22" rx="2"/><text class="c-lab c-s1t" x="231.5" y="274">500 MW</text><text class="c-box-t" x="0" y="309">X-energy, for Amazon</text><text class="c-note" x="0" y="324">target, by 2039</text><rect class="c-bar c-mute" x="210" y="300" width="155.0" height="22" rx="2"/><text class="c-lab c-s1t" x="371.0" y="316">more than 5,000 MW</text><line class="c-base" x1="210" y1="18" x2="210" y2="326"/></svg>