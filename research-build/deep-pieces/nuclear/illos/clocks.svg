<svg viewBox="0 0 940 546" role="img" aria-label="A grid of four kinds of nuclear project against the four things each needs: a grid place, a reactor, a licence and fuel. A restart, such as Crane, Palisades or Duane Arnold, has a grid place kept, or borrowed subject to the grid operator's studies, and ordinary fuel; its reactor needs repair and rehiring and its old licence must be restored. An uprate already holds its grid connection and ordinary fuel; it needs equipment from meters to turbines and a licence amendment. A new build on ordinary fuel, such as the BWRX-300 or AP1000, starts the grid place, the reactor and the licence from zero but has ordinary fuel. A new build on HALEU, such as Natrium, Aurora or Hermes, starts all three from zero and its fuel comes from one demonstration line: the binding gate."><path class="i-line" d="M284 94 L300 34 L316 94 M289 74 H311 M293 56 H307 M278 46 H322"/><path class="i-thin" d="M278 46 q -14 10 -30 14 M322 46 q 14 10 30 14"/><path class="i-metal" d="M434 94 V58 A26 26 0 0 1 486 58 V94 Z"/><rect class="i-fuel-soft" x="451" y="64" width="18" height="24" rx="2"/><rect class="i-fill" x="598" y="36" width="44" height="58" rx="2"/><line class="i-thin" x1="606" y1="48" x2="634" y2="48"/><line class="i-thin" x1="606" y1="57" x2="630" y2="57"/><line class="i-thin" x1="606" y1="66" x2="634" y2="66"/><line class="i-thin" x1="606" y1="75" x2="626" y2="75"/><circle class="i-hot-f" cx="632" cy="84" r="6" opacity=".8"/><rect class="i-fuel" x="760" y="42" width="10" height="52" rx="2" opacity=".9"/><rect class="i-fuel" x="774" y="42" width="10" height="52" rx="2" opacity=".9"/><rect class="i-fuel" x="788" y="42" width="10" height="52" rx="2" opacity=".9"/><rect class="i-metal" x="756" y="36" width="40" height="6" rx="1"/><text class="i-t" x="300" y="122" text-anchor="middle">Grid place</text><text class="i-t" x="460" y="122" text-anchor="middle">Reactor</text><text class="i-t" x="620" y="122" text-anchor="middle">Licence</text><text class="i-t" x="780" y="122" text-anchor="middle">Fuel</text><line class="i-faint" x1="20" y1="142" x2="920" y2="142"/><text class="i-t" x="24" y="176">Restart</text><text class="i-n" x="24" y="194">Crane, Palisades, Duane Arnold</text><circle class="i-line" cx="300" cy="180" r="15" style="fill:none"/><path class="i-cool-f" d="M300 165 A15 15 0 0 1 300 195 Z" opacity=".9"/><text class="i-n" x="300" y="214" text-anchor="middle">kept, or borrowed and studied</text><circle class="i-line" cx="460" cy="180" r="15" style="fill:none"/><path class="i-cool-f" d="M460 165 A15 15 0 0 1 460 195 Z" opacity=".9"/><text class="i-n" x="460" y="214" text-anchor="middle">repair and rehire</text><circle class="i-line" cx="620" cy="180" r="15" style="fill:none"/><path class="i-cool-f" d="M620 165 A15 15 0 0 1 620 195 Z" opacity=".9"/><text class="i-n" x="620" y="214" text-anchor="middle">restore the old one</text><circle class="i-cool-f" cx="780" cy="180" r="15" opacity=".9"/><path d="M773 180 l5 5 l9 -10" style="fill:none;stroke:var(--bg);stroke-width:2.6"/><text class="i-n" x="780" y="214" text-anchor="middle">ordinary fuel</text><line class="i-faint" x1="20" y1="234" x2="920" y2="234"/><text class="i-t" x="24" y="268">Uprate</text><text class="i-n" x="24" y="286">a running reactor, more heat</text><circle class="i-cool-f" cx="300" cy="272" r="15" opacity=".9"/><path d="M293 272 l5 5 l9 -10" style="fill:none;stroke:var(--bg);stroke-width:2.6"/><text class="i-n" x="300" y="306" text-anchor="middle">already connected</text><circle class="i-line" cx="460" cy="272" r="15" style="fill:none"/><path class="i-cool-f" d="M460 257 A15 15 0 0 1 460 287 Z" opacity=".9"/><text class="i-n" x="460" y="306" text-anchor="middle">meters to turbines</text><circle class="i-line" cx="620" cy="272" r="15" style="fill:none"/><path class="i-cool-f" d="M620 257 A15 15 0 0 1 620 287 Z" opacity=".9"/><text class="i-n" x="620" y="306" text-anchor="middle">an amendment</text><circle class="i-cool-f" cx="780" cy="272" r="15" opacity=".9"/><path d="M773 272 l5 5 l9 -10" style="fill:none;stroke:var(--bg);stroke-width:2.6"/><text class="i-n" x="780" y="306" text-anchor="middle">ordinary fuel</text><line class="i-faint" x1="20" y1="326" x2="920" y2="326"/><text class="i-t" x="24" y="360">New build,</text><text class="i-n" x="24" y="378">ordinary fuel: BWRX-300, AP1000</text><circle class="i-line" cx="300" cy="364" r="15" style="fill:none"/><text class="i-n" x="300" y="398" text-anchor="middle">a new request</text><circle class="i-line" cx="460" cy="364" r="15" style="fill:none"/><text class="i-n" x="460" y="398" text-anchor="middle">build from bare ground</text><circle class="i-line" cx="620" cy="364" r="15" style="fill:none"/><text class="i-n" x="620" y="398" text-anchor="middle">permit, then licence</text><circle class="i-cool-f" cx="780" cy="364" r="15" opacity=".9"/><path d="M773 364 l5 5 l9 -10" style="fill:none;stroke:var(--bg);stroke-width:2.6"/><text class="i-n" x="780" y="398" text-anchor="middle">ordinary fuel</text><line class="i-faint" x1="20" y1="418" x2="920" y2="418"/><text class="i-t" x="24" y="452">New build,</text><text class="i-n" x="24" y="470">HALEU: Natrium, Aurora, Hermes</text><circle class="i-line" cx="300" cy="456" r="15" style="fill:none"/><text class="i-n" x="300" y="490" text-anchor="middle">a new request</text><circle class="i-line" cx="460" cy="456" r="15" style="fill:none"/><text class="i-n" x="460" y="490" text-anchor="middle">build from bare ground</text><circle class="i-line" cx="620" cy="456" r="15" style="fill:none"/><text class="i-n" x="620" y="490" text-anchor="middle">permit, then licence</text><rect class="i-choke" x="711.0" y="424" width="138" height="72" rx="6"/><circle class="i-hot" cx="780" cy="456" r="15" style="fill:none;stroke-width:2.4"/><path class="i-hot" d="M772 448 L788 464 M788 448 L772 464" style="stroke-width:2.4"/><text class="i-hot-t" x="780" y="490" text-anchor="middle">one demo line</text><line class="i-faint" x1="20" y1="51