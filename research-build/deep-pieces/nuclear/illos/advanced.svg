<svg viewBox="0 0 940 416" role="img" aria-label="Four advanced reactors tied to AI, all fuelled with HALEU, against five gates. Kemmerer 1, TerraPower, 345 MW, 2030: construction permit 4 March 2026, construction under way, selling to the grid with Meta funding later units of the design, a first core from a conditional government allocation and later fuel from ASP Isotopes, which had not enriched uranium by October 2026. Aurora-ID, Oklo, 75 MW, 2028 to 2029: two of five Energy Department steps, ground broken September 2025, letters of intent only, five tonnes of government HALEU recovered from old reactor fuel. Hermes 2, Kairos, up to 50 MW, 2030: permit November 2024, site clearing, TVA buying for Google, fuel source not named. Long Mott, X-energy, four 80 MW units, early 2030s: NRC safety review finished October 2026, not yet built, Dow as buyer with Amazon behind a later project, a Centrus fuel contract for a plant starting from 2029."><text class="i-t" x="320" y="30" text-anchor="middle">Permit</text><text class="i-t" x="320" y="46" text-anchor="middle">or approval</text><text class="i-t" x="445" y="30" text-anchor="middle">Ground</text><text class="i-t" x="445" y="46" text-anchor="middle">broken</text><text class="i-t" x="570" y="30" text-anchor="middle">A buyer</text><text class="i-t" x="695" y="30" text-anchor="middle">Fuel source</text><text class="i-t" x="830" y="30" text-anchor="middle">Fuel</text><text class="i-t" x="830" y="46" text-anchor="middle">enriched</text><line class="i-faint" x1="20" y1="64" x2="920" y2="64"/><text class="i-t" x="24" y="92">Kemmerer 1</text><text class="i-n" x="24" y="110">TerraPower, 345 MW, 2030</text><circle class="i-cool-f" cx="320" cy="92" r="12" opacity=".9"/><path d="M314 92 l4 4 l8 -9" style="fill:none;stroke:var(--bg);stroke-width:2.4"/><text class="i-n" x="320" y="120" text-anchor="middle">4 Mar 2026</text><circle class="i-cool-f" cx="445" cy="92" r="12" opacity=".9"/><path d="M439 92 l4 4 l8 -9" style="fill:none;stro