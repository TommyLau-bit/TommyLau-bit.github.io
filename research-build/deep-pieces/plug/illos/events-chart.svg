<svg viewBox="0 0 560 306" role="img" aria-label="Bar chart of data centre load in PJM that switched to backup power after a fault the grid cleared normally, in megawatts. 10 July 2024: about 1,500, after six dips in 82 seconds. 17 February 2025: about 1,800, after four dips. 22 July 2026: about 3,900, in two waves, about 2,900 and then about 1,000 a minute later. For scale, the new plant and upgrades cleared in PJM's 2028/29 capacity auction: 525. A dashed line at 1,500 megawatts marks the size my test says must not recur in 2028."><g class="c-grid"><line x1="70" y1="190.0" x2="540" y2="190.0"/><line x1="70" y1="140.0" x2="540" y2="140.0"/><line x1="70" y1="90.0" x2="540" y2="90.0"/><line x1="70" y1="40.0" x2="540" y2="40.0"/></g><g class="c-axis"><text x="62" y="244.0" text-anchor="end">0</text><text x="62" y="194.0" text-anchor="end">1,000</text><text x="62" y="144.0" text-anchor="end">2,000</text><text x="62" y="94.0" text-anchor="end">3,000</text><text x="62" y="44.0" text-anchor="end">4,000</text></g><rect class="c-bar" x="106" y="165.0" width="68" height="75.0" rx="2"/><text class="c-lab c-s2t" x="140" y="157.0" text-anchor="middle">about 1,500 MW</text><text class="c-box-t" x="140" y="260" text-anchor="middle">10 Jul 2024</text><text class="c-note" x="140" y="275" text-anchor="middle">six dips in 82 s</text><rect class="c-bar" x="226" y="150.0" width="68" height="90.0" rx="2"/><text class="c-lab c-s2t" x="260" y="142.0" text-anchor="middle">about 1,800 MW</text><text class="c-box-t" x="260" y="260" text-anchor="middle">17 Feb 2025</text><text class="c-note" x="260" y="275" text-anchor="middle">four dips</text><rect class="c-bar" x="346" y="95.0" width="68" height="145.0" rx="2"/><rect class="c-bar c-alt" x="346" y="45.0" width="68" height="50.0" rx="2"/><text class="c-lab c-s2t" x="380" y="37.0" text-anchor="middle">about 3,900 MW</text><text class="c-box-t" x="380" y="260" text-anchor="middle">22 Jul 2026</text><text class="c-note" x="380" y="275" text-anchor="middle">two waves</text><rect class="c-bar c-mute" x="456" y="213.8" width="68" height="26.2" rx="2"/><text class="c-lab c-s2t" x="490" y="205.8" text-anchor="middle">525 MW</text><text class="c-box-t" x="490" y="260" text-anchor="middle">New plant</text><text class="c-note" x="490" y="275" text-anchor="middle">2028/29 auction</text><text class="c-note" x="420" y="113.0">2,900</text><text class="c-note" x="420" y="63.0">+1,000 a minute later</text><line class="c-today" x1="70" y1="165.0" x2="540" y2="165.0"/><line class="c-base" x1="70" y1="240" x2="540" y2="240"/><text class="c-note" x="70" y="298">Dashed line: 1,500 MW, the size my test says must not recur in 2028</text></svg>