<svg viewBox="0 0 940 386" role="img" aria-label="Scale drawing of SpaceX's AI1 computing satellite as published on its Starmind page. Two solar wings span 75 metres and cover about 840 square metres, delivering 210 kilowatts at 250 watts per square metre. A small bus at the centre carries chips drawing 175 kilowatts on average and 250 at peak. A radiator of 160 square metres, about a fifth of the array's area, sheds that heat at about 47 degrees, glowing from both faces. A tennis court is drawn beside it for scale. The mass filed with the FCC is 3,000 kilograms, about 58 kilowatts per tonne against a target of 100."><rect class="i-cool-f" x="95" y="34" width="350" height="120" rx="2"/><line class="i-thin" x1="145" y1="34" x2="145" y2="154"/><line class="i-thin" x1="195" y1="34" x2="195" y2="154"/><line class="i-thin" x1="245" y1="34" x2="245" y2="154"/><line class="i-thin" x1="295" y1="34" x2="295" y2="154"/><line class="i-thin" x1="345" y1="34" x2="345" y2="154"/><line class="i-thin" x1="395" y1="34" x2="395" y2="154"/><line class="i-thin" x1="95" y1="94.0" x2="445" y2="94.0"/><rect class="i-cool-f" x="495" y="34" width="350" height="120" rx="2"/><line class="i-thin" x1="545" y1="34" x2="545" y2="154"/><line class="i-thin" x1="595" y1="34" x2="595" y2="154"/><line class="i-thin" x1="645" y1="34" x2="645" y2="154"/><line class="i-thin" x1="695" y1="34" x2="695" y2="154"/><line class="i-thin" x1="745" y1="34" x2="745" y2="154"/><line class="i-thin" x1="795" y1="34" x2="795" y2="154"/><line class="i-thin" x1="495" y1="94.0" x2="845" y2="94.0"/><rect class="i-metal" x="445.0" y="69.0" width="50" height="50" rx="2"/><text class="i-cool-t" x="270" y="174" text-anchor="middle">solar array, about 840 m²</text><text class="i-cool-t" x="670" y="174" text-anchor="middle">210 kW at 250 W/m²</text><line class="i-line" x1="95.0" y1="20" x2="845.0" y2="20"/><line class="i-line" x1="95.0" y1="15" x2="95.0" y2="25"/><line class="i-line" x1="845.0" y1="15" x2="845.0" y2="25"/><text class="i-n" x="470.0" y="14" text-anchor="middle">wingspan 75 m</text><line class="i-dash" x1="470.0" y1="119.0" x2="470.0" y2="216"/><rect class="i-hot-f" x="390.0" y="216" width="160" height="100" rx="2"/><line class="i-thin" x1="398.0" y1="228" x2="542.0" y2="228"/><line class="i-thin" x1="398.0" y1="241" x2="542.0" y2="241"/><line class="i-thin" x1="398.0" y1="254" x2="542.0" y2="254"/><line class="i-thin" x1="398.0" y1="266" x2="542.0" y2="266"/><line class="i-thin" x1="398.0" y1="278" x2="542.0" y2="278"/><line class="i-thin" x1="398.0" y1="291" x2="542.0" y2="291"/><line class="i-thin" x1="398.0" y1="304" x2="542.0" y2="304"/><text class="i-hot-t" x="562.0" y="246">radiator, 160 m²</text><text class="i-n" x="562.0" y="264">sheds 175 kW at about 47°C,</text><text class="i-n" x="562.0" y="280">glowing from both faces</text><text class="i-n" x="437.0" y="206" text-anchor="end">chips: 175 kW average, 250 peak</text><rect class="i-faint" x="40" y="216" width="238" height="110"/><line class="i-thin" x1="159" y1="216" x2="159" y2="326"/><text class="i-n" x="159" y="344" text-anchor="middle">a tennis court, for scale</text><text class="i-t" x="470.0" y="372" text-anchor="middle">Mass filed with the FCC: 3,000 kg. At 175 kW, about 58 kW per tonne; the target is 100.</text></svg>