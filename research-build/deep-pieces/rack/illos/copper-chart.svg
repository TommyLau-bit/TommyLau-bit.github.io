<svg viewBox="0 0 560 216" role="img" aria-label="Bar chart of power carried per square millimetre of conductor, on Nvidia's 48 amp wire basis. 415 volts AC, the baseline, about 0.6 kilowatts per square millimetre. 480 volts AC, 16 per cent more. 800 volts DC, Nvidia's choice, 157 per cent more. 1,500 volts DC, 382 per cent more, but held back by electrical codes and the danger of arc flash."><g class="c-grid"><line x1="170.0" y1="32" x2="170.0" y2="196"/><line x1="263.3" y1="32" x2="263.3" y2="196"/><line x1="356.7" y1="32" x2="356.7" y2="196"/><line x1="450.0" y1="32" x2="450.0" y2="196"/></g><g class="c-axis"><text x="170.0" y="26" text-anchor="middle">0 kW</text><text x="263.3" y="26" text-anchor="middle">1 kW</text><text x="356.7" y="26" text-anchor="middle">2 kW</text><text x="450.0" y="26" text-anchor="middle">3 kW</text></g><text class="c-box-t" x="0" y="53">415 V AC</text><text class="c-note" x="0" y="68">today's row, the baseline</text><rect class="c-bar c-mute" x="170" y="44" width="56.0" height="22" rx="2"/><text class="c-lab c-s1t" x="232.0" y="60">0.6 kW per mm²</text><text class="c-box-t" x="0" y="95">480 V AC</text><text class="c-note" x="0" y="110">the American row</text><rect class="c-bar c-mute" x="170" y="86" width="65.0" height="22" rx="2"/><text class="c-lab c-s1t" x="241.0" y="102">16% more</text><text class="c-box-t" x="0" y="137">800 V DC</text><text class="c-note" x="0" y="152">Nvidia's choice</text><rect class="c-bar" x="170" y="128" width="143.9" height="22" rx="2"/><text class="c-lab c-s1t" x="319.9" y="144">157% more</text><text class="c-box-t" x="0" y="179">1,500 V DC</text><text class="c-note" x="0" y="194">held back by codes and arc flash</text><rect class="c-bar c-alt" x="170" y="170" width="269.9" height="22" rx="2"/><text class="c-lab c-s1t" x="445.9" y="186">382% more</text><line class="c-base" x1="170" y1="32" x2="170" y2="196"/></svg>