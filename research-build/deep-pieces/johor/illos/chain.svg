<svg viewBox="0 0 940 400" role="img" aria-label="Five steps from application to a working hall. One, apply: the operator asks the utility for supply, weeks to months. Two, allocate: the government says who may plug in; in Singapore only through a call, in Malaysia only from the grid's spare margin since 28 October 2026. This is the choke point. Three, book: a supply contract for the finished size, years before it fills; Malaysia had 8.35 GW booked in June 2026. Four, build the plant: substation, transformers and cable, 12 months on Malaysia's Green Lane, with faster delivery now priced. Five, fill: tenants rack their chips at their own pace; Malaysia's data centres draw about 22 per cent of what is connected."><defs><marker id="pc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--ink-3)"/></marker></defs><rect class="i-ground" x="0" y="210" width="940" height="14"/><line class="i-line" x1="0" y1="210" x2="940" y2="210"/><rect class="i-choke" x="194" y="40" width="176" height="352" rx="6"/><text class="i-hot-t" x="204" y="58" style="font-size:10.5px;letter-spacing:.08em">THE CHOKE POINT</text><line class="i-lead" x1="170" y1="150" x2="196" y2="150" marker-end="url(#pc)"/><line class="i-lead" x1="354" y1="150" x2="380" y2="150" marker-end="url(#pc)"/><line class="i-lead" x1="538" y1="150" x2="564" y2="150" marker-end="url(#pc)"/><line class="i-lead" x1="722" y1="150" x2="748" y2="150" marker-end="url(#pc)"/><rect class="i-fill" x="60" y="100" width="70" height="92" rx="3"/><rect class="i-metal" x="82" y="94" width="26" height="10" rx="2"/><line class="i-thin" x1="70" y1="118" x2="118" y2="118"/><line class="i-thin" x1="70" y1="132" x2="112" y2="132"/><line class="i-thin" x1="70" y1="146" x2="120" y2="146"/><line class="i-thin" x1="70" y1="160" x2="106" y2="160"/><line class="i-thin" x1="70" y1="174" x2="116" y2="174"/><path class="i-fill" d="M234 114 L284 86 L334 114 Z"/><rect class="i-fil