<svg viewBox="0 0 940 430" role="img" aria-label="Illustrative staircase for a 100 megawatt campus over six years. The booked maximum demand is a flat dashed line at 100 MW. The declared demand steps up each year: 20, 40, 60, 80, then 100 MW. Tenaga's connected load charge line sits at 85 per cent of each declared step in years one to four and at 75 per cent of the final 100 MW in years five and six. The drawn power rises from zero to about 70 MW; where it is below the charge line, the shortfall is billed at RM8.50 per kilowatt a month."><line class="i-line" x1="70" y1="370" x2="620" y2="370"/><line class="i-line" x1="70" y1="370" x2="70" y2="50"/><text class="i-n" x="60" y="374.0" text-anchor="end">0</text><line class="i-faint" x1="70" y1="370.0" x2="620" y2="370.0"/><text class="i-n" x="60" y="303.54545454545456" text-anchor="end">25</text><line class="i-faint" x1="70" y1="299.54545454545456" x2="620" y2="299.54545454545456"/><text class="i-n" x="60" y="233.0909090909091" text-anchor="end">50</text><line class="i-faint" x1="70" y1="229.0909090909091" x2="620" y2="229.0909090909091"/><text class="i-n" x="60" y="162.63636363636363" text-anchor="end">75</text><line class="i-faint" x1="70" y1="158.63636363636363" x2="620" y2="158.63636363636363"/><text class="i-n" x="60" y="92.18181818181819" text-anchor="end">100</text><line class="i-faint" x1="70" y1="88.18181818181819" x2="620" y2="88.18181818181819"/><text class="i-k" x="60" y="38" text-anchor="end">MW</text><text class="i-n" x="115.83333333333334" y="390" text-anchor="middle">Year 1</text><text class="i-n" x="207.5" y="390" text-anchor="middle">Year 2</text><text class="i-n" x="299.1666666666667" y="390" text-anchor="middle">Year 3</text><text class="i-n" x="390.83333333333337" y="390" text-anchor="middle">Year 4</text><text class="i-n" x="482.5" y="390" text-anchor="middle">Year 5</text><text class="i-n" x="574.1666666666666" y="390" text-anchor="middle">Year 6</text><path d="M70.0 322.1 L115.8 322.1 L115.8 353.