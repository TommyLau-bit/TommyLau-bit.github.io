<svg viewBox="0 0 940 617" role="img" aria-label="Schematic map of southern Johor and Singapore. Data centre clusters sit inland at Sedenak and Kulai (YTL, Princeton Digital, Bridge, K2, and land bought by Microsoft), where a new 500/275/132 kV substation is under way at Sedenak West, and near Johor Bahru at Iskandar Puteri and Nusajaya (DayOne, AirTrunk, Equinix), Kempas (DayOne) and Ulu Tiram (Bridge). A new 500 kV backbone of about 500 km from the east coast ends at Kulai East by 2030. Tanjung Bin coal station, 2,100 MW, retires in 2031; Pasir Gudang has a 1,440 MW gas plant. Singapore, across the causeway, has about 1.6 GW of data centre IT capacity and makes about 95% of its power from gas; its green data centre park on Jurong Island has up to 700 MW, including the 200 MW awarded in 2026."><defs><marker id="mh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--ink-3)"/></marker></defs><rect x="0" y="0" width="940" height="617" style="fill:color-mix(in srgb, var(--cool) 14%, var(--bg))"/><path d="M0.0 0.0 L0.0 140.3 L84.2 238.5 L189.4 322.7 L287.6 399.9 L336.7 484.0 L371.8 554.2 L399.9 519.1 L427.9 484.0 L456.0 463.0 L484.0 441.9 L519.1 427.9 L554.2 417.4 L589.3 412.5 L631.3 424.4 L680.4 431.4 L729.6 427.9 L757.6 463.0 L785.7 491.0 L841.8 463.0 L897.9 357.8 L890.9 182.4 L855.8 0.0 Z" style="fill:var(--bg);stroke:var(--ink-2);stroke-width:1.2"/><path class="i-metal" d="M463.0 519.1 L477.0 498.1 L505.1 463.0 L540.1 438.4 L575.2 429.3 L603.3 431.4 L631.3 449.0 L666.4 463.0 L708.5 470.0 L736.6 494.6 L715.5 519.1 L666.4 533.1 L617.3 550.7 L575.2 554.2 L533.1 543.7 L491.0 533.1 Z"/><path class="i-fuel-soft" d="M480.5 555.6 L498.1 543.0 L522.6 548.6 L519.1 566.8 L494.6 568.2 Z"/><line class="i-line" x1="552.8" y1="419.5" x2="552.8" y2="432.1" style="stroke-width:3"/><line class="i-line" x1="459.5" y1="484.0" x2="461.6" y2="508.6" style="stroke-width:3"/><path class="i-hot" d="M294.6 0.0 C 334