<svg viewBox="0 0 560 282" role="img" aria-label="Gigawatts, Peninsular Malaysia. Data centres drew 1.37 GW in August 2026. Planners project a data centre peak of 8.39 GW by 2030. Data centres have booked 8.77 GW under signed supply agreements. If all 117 approved data centres are built, the investment minister said they would need about 23 to 23.5 GW. The peninsula's record peak demand, for all users, was 22.0 GW on 6 August 2026, and its installed generating capacity is 29.2 GW."><g class="c-grid"><line x1="210.0" y1="18" x2="210.0" y2="266"/><line x1="297.5" y1="18" x2="297.5" y2="266"/><line x1="385.0" y1="18" x2="385.0" y2="266"/><line x1="472.5" y1="18" x2="472.5" y2="266"/></g><g class="c-axis"><text x="210.0" y="12" text-anchor="middle">0</text><text x="297.5" y="12" text-anchor="middle">10</text><text x="385.0" y="12" text-anchor="middle">20</text><text x="472.5" y="12" text-anchor="middle">30</text></g><text class="c-box-t" x="0" y="39">Data centres, drawn</text><text class="c-note" x="0" y="54">August 2026, Malaysia</text><rect class="c-bar" x="210" y="30" width="12.0" height="22" rx="2"/><text class="c-lab c-s1t" x="228.0" y="46">1.37</text><text class="c-box-t" x="0" y="81">Data centre peak, 2030</text><text class="c-note" x="0" y="96">planning projection</text><rect class="c-bar c-mute" x="210" y="72" width="73.4" height="22" rx="2"/><text class="c-lab c-s1t" x="289.4" y="88">8.39</text><text class="c-box-t" x="0" y="123">Data centres, booked</text><text class="c-note" x="0" y="138">all supply agreements, Aug 2026</text><rect class="c-bar c-mute" x="210" y="114" width="76.7" height="22" rx="2"/><text class="c-lab c-s1t" x="292.7" y="130">8.77</text><text class="c-box-t" x="0" y="165">117 approved centres</text><text class="c-note" x="0" y="180">if all built, minister (oral)</text><rect class="c-bar" x="210" y="156" width="203.4" height="22" rx="2"/><text class="c-lab c-s1t" x="419.4" y="172">about 23 to 23.5</text><text class="c-box-t" x="0" y="207">Peninsula, record peak</text><text class="c-note" x="0" y="222">all users, 6 Aug 2026</text><rect class="c-bar c-alt" x="210" y="198" width="192.6" height="22" rx="2"/><text class="c-lab c-s1t" x="408.6" y="214">22.0</text><text class="c-box-t" x="0" y="249">Peninsula, installed</text><text class="c-note" x="0" y="264">all power stations, June 2026</text><rect class="c-bar c-alt" x="210" y="240" width="255.5" height="22" rx="2"/><text class="c-lab c-s1t" x="471.5" y="256">29.2</text><line class="c-base" x1="210" y1="18" x2="210" y2="266"/></svg>