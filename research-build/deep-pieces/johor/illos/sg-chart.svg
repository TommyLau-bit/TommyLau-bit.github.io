<svg viewBox="0 0 560 198" role="img" aria-label="Megawatts. Singapore allocated about 80 MW in its pilot call, awarded July 2023, and 200 MW in its second call, awarded August 2026. Its data centres drew about 740 MW on average in 2024, from 6.5 terawatt-hours, about 10 per cent of national electricity use. Its whole fleet has more than 1.6 GW of maximum IT load capacity, including the 200 MW just awarded."><g class="c-grid"><line x1="210.0" y1="18" x2="210.0" y2="182"/><line x1="292.4" y1="18" x2="292.4" y2="182"/><line x1="374.7" y1="18" x2="374.7" y2="182"/><line x1="457.1" y1="18" x2="457.1" y2="182"/></g><g class="c-axis"><text x="210.0" y="12" text-anchor="middle">0</text><text x="292.4" y="12" text-anchor="middle">500</text><text x="374.7" y="12" text-anchor="middle">1000</text><text x="457.1" y="12" text-anchor="middle">1500</text></g><text class="c-box-t" x="0" y="39">Pilot call</text><text class="c-note" x="0" y="54">awarded July 2023</text><rect class="c-bar" x="210" y="30" width="13.2" height="22" rx="2"/><text class="c-lab c-s1t" x="229.2" y="46">about 80 MW</text><text class="c-box-t" x="0" y="81">Second call</text><text class="c-note" x="0" y="96">awarded August 2026</text><rect class="c-bar" x="210" y="72" width="32.9" height="22" rx="2"/><text class="c-lab c-s1t" x="248.9" y="88">200 MW</text><text class="c-box-t" x="0" y="123">Average draw, 2024</text><text class="c-note" x="0" y="138">6.5 TWh, about 10% of use</text><rect class="c-bar c-mute" x="210" y="114" width="121.9" height="22" rx="2"/><text class="c-lab c-s1t" x="337.9" y="130">about 740 MW</text><text class="c-box-t" x="0" y="165">Whole fleet, IT capacity</text><text class="c-note" x="0" y="180">maximum, 2026, incl. the 200</text><rect class="c-bar c-alt" x="210" y="156" width="263.5" height="22" rx="2"/><text class="c-lab c-s1t" x="479.5" y="172">more than 1.6 GW</text><line class="c-base" x1="210" y1="18" x2="210" y2="182"/></svg>