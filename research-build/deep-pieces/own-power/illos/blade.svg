<svg viewBox="0 0 940 470" role="img" aria-label="A first-stage turbine blade, about a hand's length, with its fir-tree root. It is cast as one metal crystal, so there are no grain boundaries to creep and crack at heat. Cooling passages are cast in around ceramic cores; cooling air from the compressor runs through them and leaves by rows of tiny holes, laying a cool film on the surface. A thin ceramic thermal barrier coat sits on a metal bond coat. A temperature scale shows the gas entering the turbine at 1,600 degrees Celsius, above the point at which a common blade alloy starts to melt, about 1,340 degrees; the coat and the cooling hold the metal well below it."><path class="i-metal" d="M80 400 h150 v-26 h-14 v-14 h14 v-14 h-14 v-14 h14 v-12 h-150 v12 h14 v14 h-14 v14 h14 v14 h-14 Z"/><rect class="i-metal" x="64" y="300" width="182" height="20" rx="3"/><path class="i-fill" d="M90 300 C70 220 84 120 114 70 C150 60 200 70 216 84 C190 150 190 230 210 300 Z" style="stroke-width:1.6"/><path class="i-cool" d="M120 296 C114 220 118 140 130 96 M146 96 C142 160 142 230 150 296 M166 296 C162 230 162 160 170 100 M186 100 C180 170 182 236 190 296" style="stroke-dasharray:5 3"/><circle class="i-cool-f" cx="100" cy="108" r="2.6"/><circle class="i-cool-f" cx="107" cy="130" r="2.6"/><circle class="i-cool-f" cx="108" cy="152" r="2.6"/><circle class="i-cool-f" cx="106" cy="174" r="2.6"/><circle class="i-cool-f" cx="107" cy="196" r="2.6"/><circle class="i-cool-f" cx="108" cy="218" r="2.6"/><circle class="i-cool-f" cx="106" cy="240" r="2.6"/><circle class="i-cool-f" cx="107" cy="262" r="2.6"/><circle class="i-cool-f" cx="102" cy="284" r="2.6"/><path class="i-cool" d="M140 450 V412"/><path class="i-cool" d="M133 420 l7 -10 l7 10"/><text class="i-cool-t" x="150" y="452">cooling air from the compressor</text><path class="i-hot" d="M10 150 H68"/><path class="i-hot" d="M60 143 l9 7 l-9 7"/><path class="i-hot" d="M10 210 H64"/><path class="i-hot" d="M56 203 l9 7 l-9 7"/><text class="i-hot-t" x="10" y="136">hot gas</text><text class="i-t" x="140" y="40" text-anchor="middle">A first-stage blade</text><text class="i-n" x="140" y="56" text-anchor="middle">about a hand's length</text><line class="i-lead" x1="212" y1="100" x2="292" y2="100"/><text class="i-t" x="300" y="96">One metal crystal</text><text class="i-n" x="300" y="113">grown whole, so there are no grain boundaries</text><text class="i-n" x="300" y="129">to creep and crack at heat</text><line class="i-lead" x1="190" y1="190" x2="292" y2="190"/><text class="i-t" x="300" y="186">Cooling passages</text><text class="i-n" x="300" y="203">cast in around ceramic cores; air leaves by rows</text><text class="i-n" x="300" y="219">of tiny holes and lays a cool film on the skin</text><line class="i-lead" x1="190" y1="280" x2="292" y2="280"/><text class="i-t" x="300" y="276">Ceramic coat</text><text class="i-n" x="300" y="293">a thin thermal barrier over a metal bond coat</text><line class="i-line" x1="690" y1="400.0" x2="690" y2="80.0"/><line class="i-thin" x1="685" y1="400.0" x2="695" y2="400.0"/><text class="i-n" x="680" y="404.0" text-anchor="end">0°C</text><line class="i-thin" x1="685" y1="305.9" x2="695" y2="305.9"/><text class="i-n" x="680" y="309.9" text-anchor="end">500°C</text><line class="i-thin" x1="685" y1="211.8" x2="695" y2="211.8"/><text class="i-n" x="680" y="215.8" text-anchor="end">1,000°C</text><line class="i-thin" x1="685" y1="117.6" x2="695" y2="117.6"/><text class="i-n" x="680" y="121.6" text-anchor="end">1,500°C</text><rect class="i-choke" x="702" y="86.8" width="220" height="24" rx="4"/><circle class="i-hot-f" cx="690" cy="98.8" r="6"/><text class="i-hot-t" x="710" y="102.8">gas entering the turbine: 1,600°C</text><circle class="i-fuel" cx="690" cy="147.8" r="5"/><text class="i-fuel-t" x="710" y="151.8">a common blade alloy</text><text class="i-fuel-t" x="710" y="166.8">starts to melt: about 1,340°C</text><path class="i-cool" d="M720 166.6 V230.6"/><path class="i-cool" d="M713 220.6 l7 10 l7 -10"/><text class="i-cool-t" x="734" y="196.7">coat and cooling hold</text><text class="i-cool-t" x="734" y="211.7">the metal well below it</text><text class="i-t" x="690" y="44" text-anchor="middle">The flame is hotter than the metal can stand</text></svg>