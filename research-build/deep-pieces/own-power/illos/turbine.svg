<svg viewBox="0 0 940 488" role="img" aria-label="A heavy gas turbine and a combined cycle plant, simplified. On the left, a generator on the same shaft as the gas turbine. The compressor squeezes air about 24 times. In the combustor gas burns at about 1,600 degrees Celsius. The hot gas spins the turbine, which turns both the compressor and the generator. The exhaust leaves at about 670 degrees. In simple cycle it goes up a stack, and about 43 per cent of the gas's energy becomes electricity, as in one GE 7HA.03 of 430 MW. In combined cycle the exhaust boils water in a heat recovery boiler, and the steam drives a steam turbine and a second generator, lifting efficiency to about 64 per cent, about 640 MW from the same turbine."><path class="i-thin" d="M20 34 V24 H600 V34"/><text class="i-k" x="310" y="16" text-anchor="middle">Simple cycle: the gas turbine alone</text><path class="i-thin" d="M612 34 V24 H930 V34"/><text class="i-k" x="771" y="16" text-anchor="middle">Combined cycle adds a steam loop</text><rect class="i-metal" x="24" y="190" width="88" height="80" rx="8"/><text class="i-t" x="68" y="294" text-anchor="middle">Generator</text><line class="i-line" x1="112" y1="230" x2="140" y2="230" style="stroke-width:4"/><path class="i-fill" d="M140 152 L320 194 L320 266 L140 308 Z"/><line class="i-thin" x1="156" y1="160" x2="156" y2="300"/><line class="i-thin" x1="177" y1="165" x2="177" y2="295"/><line class="i-thin" x1="198" y1="170" x2="198" y2="290"/><line class="i-thin" x1="219" y1="175" x2="219" y2="285"/><line class="i-thin" x1="240" y1="180" x2="240" y2="280"/><line class="i-thin" x1="261" y1="185" x2="261" y2="275"/><line class="i-thin" x1="282" y1="190" x2="282" y2="270"/><line class="i-thin" x1="303" y1="195" x2="303" y2="265"/><path class="i-cool" d="M118 120 C150 120 160 140 170 160"/><path class="i-cool" d="M164 150 l8 12 l4 -14"/><text class="i-cool-t" x="110" y="112">air in</text><text class="i-t" x="230" y="340" text-anchor="middle">Compressor</text><text class="i-n" x="230" y="358" text-anchor="middle">squeezes air about 24 times</text><rect class="i-fill" x="320" y="190" width="66" height="80" rx="6"/><path class="i-hot-f" d="M353 252 C335 234 348 220 353 204 C360 220 372 232 353 252 Z" opacity=".85"/><path class="i-fuel" d="M353 110 V186" style="stroke:var(--fuel);stroke-width:3;fill:none"/><text class="i-fuel-t" x="353" y="102" text-anchor="middle">gas in</text><line class="i-lead" x1="353" y1="274" x2="353" y2="380"/><text class="i-t" x="353" y="398" text-anchor="middle">Combustor</text><text class="i-hot-t" x="353" y="416" text-anchor="middle">gas burns at about 1,600°C</text><path class="i-fill" d="M386 190 L500 160 L500 300 L386 270 Z"/><line class="i-hot" x1="398" y1="192" x2="398" y2="268" style="stroke-width:1.4"/><line class="i-hot" x1="420" y1="185" x2="420" y2="275" style="stroke-width:1.4"/><line class="i-hot" x1="442" y1="178" x2="442" y2="282" style="stroke-width:1.4"/><line class="i-hot" x1="464" y1="171" x2="464" y2="289" style="stroke-width:1.4"/><line class="i-hot" x1="486" y1="164" x2="486" y2="296" style="stroke-width:1.4"/><text class="i-t" x="443" y="340" text-anchor="middle">Turbine</text><text class="i-n" x="443" y="358" text-anchor="middle">hot gas spins it; it turns</text><text class="i-n" x="443" y="374" text-anchor="middle">the compressor and generator</text><line class="i-line" x1="140" y1="230" x2="500" y2="230" style="stroke-dasharray:6 4"/><path class="i-fill" d="M500 160 L600 160 L600 300 L500 300"/><path class="i-hot" d="M512 230 H588"/><path class="i-hot" d="M580 223 l9 7 l-9 7"/><text class="i-hot-t" x="550" y="322" text-anchor="middle">exhaust</text><text class="i-hot-t" x="550" y="338" text-anchor="middle">about 670°C</text><path class="i-dash" d="M560 160 V100 H590 V160" style="fill:none"/><text class="i-n" x="575" y="74" text-anchor="middle">simple cycle:</text><text class="i-n" x="575" y="90" text-anchor="middle">heat goes up</text><rect class="i-fill" x="612" y="160" width="140" height="140" rx="4"/><path class="i-cool" d="M632 286 V174" style="stroke-width:1.4"/><path class="i-cool" d="M656 286 V174" style="stroke-width:1.4"/><path class="i-cool" d="M680 286 V174" style="stroke-width:1.4"/><path class="i-cool" d="M704 286 V174" style="stroke-width:1.4"/><path class="i-cool" d="M728 286 V174" style="stroke-width:1.4"/><path class="i-line" d="M720 160 V100 H748 V160" style="fill:none"/><text class="i-n" x="734" y="90" text-anchor="middle">cooled exhaust</text><text class="i-t" x="682" y="340" text-anchor="middle">Heat recovery boiler</text><text class="i-n" x="682" y="358" text-anchor="middle">exhaust boils water to steam</text><path class="i-cool" d="M752 190 H790"/><path class="i-cool" d="M783 183 l9 7 l-9 7"/><path class="i-fill" d="M794 202 L846 180 L846 280 L794 258 Z"/><rect class="i-metal" x="858" y="196" width="66" height="68" rx="8"/><line class="i-line" x1="846" y1="230" x2="858" y2="230" style="stroke-width:4"/><text class="i-t" x="860" y="340" text-anchor="middle">Steam turbine</text><text class="i-n" x="860" y="358" text-anchor="middle">and a second generator</text><path class="i-cool" d="M820 282 V306 H700 V300" style="stroke-dasharray:3 3"/><text class="i-n" x="760" y="322" text-anchor="middle">water back</text><line class="i-faint" x1="20" y1="432" x2="920" y2="432"/><text class="i-t" x="24" y="458">About 43 per cent</text><text class="i-n" x="24" y="476">of the gas's energy becomes electricity: one GE 7HA.03, 430 MW</text><text class="i-t" x="612" y="458">About 64 per cent</text><text class="i-n" x="612" y="476">same turbine plus steam: about 640 MW</text></svg>