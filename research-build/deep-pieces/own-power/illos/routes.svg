<svg viewBox="0 0 560 424" role="img" aria-label="Dated routes to on-site gas power and its fuel, from the first decision to the first power or gas the owner gives. Socrates, 556 MW off the grid for a Meta affiliate: approved September 2025, power late 2026. Williams' next four plants, 2,032 MW: financed July 2026, power from the second half of 2027 to the second half of 2028. Homer City, up to 4,678 MW: air permit November 2025, first power targeted early 2028. Entergy's plants for Hyperion, 2,262 MW: approved August 2025, power 2028 to 2029. Wärtsilä's 282 MW engine order: booked in the third quarter of 2026, fully running in 2029. Entergy's second Hyperion deal, 5,278 MW: signed March 2026, vote pending, power 2030 to 2031. Transco's Southeast Supply Enhancement pipe: open season mid-2023, gas as early as the third quarter of 2027. Kinder Morgan's Permian Link: sanctioned October 2026, gas from the third quarter of 2030. A heavy turbine slot sold now: ships in 2032 and needs about 18 months on site, so power around 2034."><g class="c-grid"><line x1="196.0" y1="24" x2="196.0" y2="378"/><line x1="250.0" y1="24" x2="250.0" y2="378"/><line x1="304.0" y1="24" x2="304.0" y2="378"/><line x1="358.0" y1="24" x2="358.0" y2="378"/><line x1="412.0" y1="24" x2="412.0" y2="378"/><line x1="466.0" y1="24" x2="466.0" y2="378"/><line x1="520.0" y1="24" x2="520.0" y2="378"/></g><g class="c-axis"><text x="196.0" y="394" text-anchor="middle">2023</text><text x="250.0" y="394" text-anchor="middle">2025</text><text x="304.0" y="394" text-anchor="middle">2027</text><text x="358.0" y="394" text-anchor="middle">2029</text><text x="412.0" y="394" text-anchor="middle">2031</text><text x="466.0" y="394" text-anchor="middle">2033</text><text x="520.0" y="394" text-anchor="middle">2035</text></g><line class="c-today" x1="299.9" y1="24" x2="299.9" y2="378"/><text class="c-today-t" x="299.9" y="18" text-anchor="middle">today</text><text class="c-box-t" x="0" y="42">Socrates, Williams</text><text class="c-note" x="0" y="57">556 MW, off the grid</text><g class="c-span"><line x1="269.4" y1="40" x2="299.9" y2="40"/></g><g class="c-start"><circle cx="269.4" cy="40" r="4"/></g><g class="c-end"><circle cx="299.9" cy="40" r="4.5"/></g><g class="c-endt"><text x="307.9" y="44">late 2026</text></g><text class="c-box-t" x="0" y="82">Williams' next four</text><text class="c-note" x="0" y="97">2,032 MW</text><g class="c-span"><line x1="291.4" y1="80" x2="324.2" y2="80"/></g><g class="c-span"><line x1="324.2" y1="80" x2="351.2" y2="80" style="stroke-width:7;opacity:.45"/></g><g class="c-start"><circle cx="291.4" cy="80" r="4"/></g><g class="c-end"><circle cx="324.2" cy="80" r="4.5"/></g><g class="c-endt"><text x="359.2" y="84">2027 to 2028</text></g><text class="c-box-t" x="0" y="122">Homer City</text><text class="c-note" x="0" y="137">up to 4,678 MW</text><g class="c-span"><line x1="273.9" y1="120" x2="336.4" y2="120"/></g><g class="c-start"><circle cx="273.9" cy="120" r="4"/></g><g class="c-end"><circle cx="336.4" cy="120" r="4.5"/></g><g class="c-endt"><text x="344.4" y="124">early 2028</text></g><text class="c-box-t" x="0" y="162">Hyperion, Entergy</text><text class="c-note" x="0" y="177">2,262 MW</text><g class="c-span"><line x1="266.9" y1="160" x2="344.5" y2="160"/></g><g class="c-span"><line x1="344.5" y1="160" x2="371.5" y2="160" style="stroke-width:7;opacity:.45"/></g><g class="c-start"><circle cx="266.9" cy="160" r="4"/></g><g class="c-end"><circle cx="344.5" cy="160" r="4.5"/></g><g class="c-endt"><text x="379.5" y="164">2028 to 2029</text></g><text class="c-box-t" x="0" y="202">Wärtsilä engines</text><text class="c-note" x="0" y="217">282 MW order</text><g class="c-span"><line x1="293.2" y1="200" x2="371.5" y2="200"/></g><g class="c-start"><circle cx="293.2" cy="200" r="4"/></g><g class="c-end"><circle cx="371.5" cy="200" r="4.5"/></g><g class="c-endt"><text x="379.5" y="204">2029</text></g><text class="c-box-t" x="0" y="242">Hyperion, second deal</text><text