<svg viewBox="0 0 940 470" role="img" aria-label="Two ways to power a data centre. On the grid, thousands of plants share the load, and when one trips or the load jumps the rest cover it; on 22 July 2026, after one fault, about 3,900 MW of data-centre load in PJM switched to backup at once and the grid absorbed it. An island campus must carry its own cover: eight generating units for a data centre with 400 MW committed, six carrying the load, one spare and one margin for hot days, plus a battery to soak up swings. Williams' Socrates has 556 MW built for 400 MW committed, 1.39 MW for each MW. The three reasons: a spare for every outage; margin for heat, since an aeroderivative loses about a quarter of its output at 45 degrees; and a buffer for swings, since a campus's load can drop off or return by hundreds of megawatts at once."><line class="i-faint" x1="470" y1="20" x2="470" y2="450"/><text class="i-k" x="40" y="40">On the grid</text><rect class="i-fill" x="40" y="90" width="31" height="22" rx="2"/><rect class="i-fill" x="60" y="74" width="7" height="16"/><rect class="i-fill" x="100" y="70" width="31" height="22" rx="2"/><rect class="i-fill" x="120" y="54" width="7" height="16"/><rect class="i-fill" x="160" y="96" width="31" height="22" rx="2"/><rect class="i-fill" x="180" y="80" width="7" height="16"/><rect class="i-fill" x="60" y="150" width="31" height="22" rx="2"/><rect class="i-fill" x="80" y="134" width="7" height="16"/><rect class="i-fill" x="130" y="140" width="31" height="22" rx="2"/><rect class="i-fill" x="150" y="124" width="7" height="16"/><rect class="i-fill" x="200" y="160" width="31" height="22" rx="2"/><rect class="i-fill" x="220" y="144" width="7" height="16"/><rect class="i-fill" x="90" y="210" width="31" height="22" rx="2"/><rect class="i-fill" x="110" y="194" width="7" height="16"/><rect class="i-fill" x="170" y="220" width="31" height="22" rx="2"/><rect class="i-fill" x="190" y="204" width="7" height="16"/><path class="i-line" d="M250 190 L260 